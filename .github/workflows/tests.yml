name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # sounddevice is stubbed and pynput uses its dummy backend (see
        # conftest.py), so the suite runs headless without PortAudio or X11.
        run: pytest --cov=tak --cov-report=term-missing
